[project]
name = "botcleaner"
version = "0.1.0"
description = "Bot Account Cleaner — flag and remove bots from your friends, followers and following; purge bots platform-wide with appeals"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "cryptography>=41",
]

[project.optional-dependencies]
images = ["Pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
botcleaner = "botcleaner.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["botcleaner*"]

[tool.setuptools.package-data]
botcleaner = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
