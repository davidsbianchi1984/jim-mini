<svg role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="Helvetica, Arial, sans-serif"><title id="t">Robots as guardian responders</title><desc id="d">Rated first-aid roles, with autonomous resuscitation behind a signed waiver. Generated by tools/build_assets.py.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1626"/><stop offset="1" stop-color="#0a0f1c"/></linearGradient><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#3aa0ff"/></linearGradient><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#43e08a" stop-opacity="0.30"/><stop offset="1" stop-color="#43e08a" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#626d88"/></marker></defs><rect width="1280" height="640" fill="url(#bg)"/><text x="86" y="76" font-size="30" fill="#eef1f7" font-weight="800" text-anchor="start">Robots as responders</text><text x="86" y="106" font-size="14" fill="#8a94ad" font-weight="400" text-anchor="start">A body that can fetch the AED is worth more than a notification. Within limits.</text><rect x="86" y="168" width="350" height="150" rx="16" fill="#182238" stroke="#26314e" stroke-width="1.2"/><rect x="86" y="168" width="4" height="150" rx="2" fill="#43e08a"/><text x="106" y="198" font-size="15" fill="#eef1f7" font-weight="700" text-anchor="start">Assist-rated</text><text x="106" y="222" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">Fetches the AED, coaches the</text><text x="106" y="242" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">playbook aloud, opens the</text><text x="106" y="262" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">door, calls the contact.</text><rect x="359.2" y="182" width="62.800000000000004" height="22" rx="11" fill="rgba(255,255,255,0.05)" stroke="#43e08a" stroke-width="1"/><text x="390.6" y="197.5" font-size="10.5" fill="#43e08a" font-weight="700" text-anchor="middle">ALLOWED</text><rect x="466" y="168" width="350" height="150" rx="16" fill="#182238" stroke="#26314e" stroke-width="1.2"/><rect x="466" y="168" width="4" height="150" rx="2" fill="#f7b731"/><text x="486" y="198" font-size="15" fill="#eef1f7" font-weight="700" text-anchor="start">Perform-rated</text><text x="486" y="222" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">May deliver compressions —</text><text x="486" y="242" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">only after a person on scene</text><text x="486" y="262" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">confirms.</text><rect x="752.0" y="182" width="50.0" height="22" rx="11" fill="rgba(255,255,255,0.05)" stroke="#f7b731" stroke-width="1"/><text x="777.0" y="197.5" font-size="10.5" fill="#f7b731" font-weight="700" text-anchor="middle">GATED</text><rect x="846" y="168" width="348" height="150" rx="16" fill="#182238" stroke="#26314e" stroke-width="1.2"/><rect x="846" y="168" width="4" height="150" rx="2" fill="#ff3b30"/><text x="866" y="198" font-size="15" fill="#eef1f7" font-weight="700" text-anchor="start">Autonomous</text><text x="866" y="222" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">Behind a signed liability</text><text x="866" y="242" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">waiver, and never signable</text><text x="866" y="262" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">for a minor. By anyone.</text><rect x="1123.6" y="182" width="56.400000000000006" height="22" rx="11" fill="rgba(255,255,255,0.05)" stroke="#ff3b30" stroke-width="1"/><text x="1151.8" y="197.5" font-size="10.5" fill="#ff3b30" font-weight="700" text-anchor="middle">LOCKED</text><rect x="86" y="372" width="1108" height="92" rx="16" fill="#1f2b45" stroke="#26314e" stroke-width="1.2"/><rect x="86" y="372" width="4" height="92" rx="2" fill="#ff4d5e"/><text x="108" y="402" font-size="15" fill="#eef1f7" font-weight="700" text-anchor="start">A robot never delivers the shock</text><text x="108" y="428" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">The AED decides. Every command a body accepts is on a per-kind allowlist, and every one is audited.</text><text x="86" y="522" font-size="13" fill="#626d88" font-weight="400" text-anchor="start">Binding a robot does not hand it judgement — it hands it a task list the escalation ladder controls.</text><text x="86" y="546" font-size="13" fill="#626d88" font-weight="400" text-anchor="start">Unbinding keeps the sealed record: what it saw stays the user's, not the manufacturer's.</text></svg>