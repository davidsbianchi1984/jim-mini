<svg role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="Helvetica, Arial, sans-serif"><title id="t">JIM-mini / Guardian — personal guidance for known conditions</title><desc id="d">JIM-mini: monitor, predict, guide, escalate — with a life layer and care beacons. Generated by tools/build_assets.py.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1626"/><stop offset="1" stop-color="#0a0f1c"/></linearGradient><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#3aa0ff"/></linearGradient><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#43e08a" stop-opacity="0.30"/><stop offset="1" stop-color="#43e08a" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#626d88"/></marker></defs><rect width="1280" height="640" fill="url(#bg)"/><text x="86" y="92" font-size="46" fill="#eef1f7" font-weight="800" text-anchor="start" letter-spacing="1">JIM-mini</text><rect x="88" y="108" width="92" height="4" rx="2" fill="url(#brand)"/><text x="86" y="138" font-size="16" fill="#8a94ad" font-weight="400" text-anchor="start">Monitor · predict · guide · escalate</text><text x="86" y="162" font-size="13" fill="#626d88" font-weight="400" text-anchor="start">…and a printed code that raises whoever is watching</text><rect x="86" y="236" width="300" height="42" rx="12" fill="#182238" stroke="#26314e" stroke-width="1"/><rect x="86" y="236" width="4" height="42" rx="2" fill="#626d88"/><circle cx="116" cy="257" r="6" fill="#626d88"/><text x="136" y="262" font-size="13.5" fill="#eef1f7" font-weight="600" text-anchor="start">log</text><text x="372" y="262" font-size="12" fill="#626d88" font-weight="700" text-anchor="end">0</text><rect x="86" y="290" width="300" height="42" rx="12" fill="#182238" stroke="#26314e" stroke-width="1"/><rect x="86" y="290" width="4" height="42" rx="2" fill="#3aa0ff"/><circle cx="116" cy="311" r="6" fill="#3aa0ff"/><text x="136" y="316" font-size="13.5" fill="#eef1f7" font-weight="600" text-anchor="start">guide</text><text x="372" y="316" font-size="12" fill="#626d88" font-weight="700" text-anchor="end">1</text><rect x="86" y="344" width="300" height="42" rx="12" fill="#182238" stroke="#26314e" stroke-width="1"/><rect x="86" y="344" width="4" height="42" rx="2" fill="#38bdf8"/><circle cx="116" cy="365" r="6" fill="#38bdf8"/><text x="136" y="370" font-size="13.5" fill="#eef1f7" font-weight="600" text-anchor="start">check in</text><text x="372" y="370" font-size="12" fill="#626d88" font-weight="700" text-anchor="end">2</text><rect x="86" y="398" width="300" height="42" rx="12" fill="#182238" stroke="#26314e" stroke-width="1"/><rect x="86" y="398" width="4" height="42" rx="2" fill="#f7b731"/><circle cx="116" cy="419" r="6" fill="#f7b731"/><text x="136" y="424" font-size="13.5" fill="#eef1f7" font-weight="600" text-anchor="start">notify contact</text><text x="372" y="424" font-size="12" fill="#626d88" font-weight="700" text-anchor="end">3</text><rect x="86" y="452" width="300" height="42" rx="12" fill="#182238" stroke="#26314e" stroke-width="1"/><rect x="86" y="452" width="4" height="42" rx="2" fill="#ff3b30"/><circle cx="116" cy="473" r="6" fill="#ff3b30"/><text x="136" y="478" font-size="13.5" fill="#eef1f7" font-weight="600" text-anchor="start">emergency services</text><text x="372" y="478" font-size="12" fill="#626d88" font-weight="700" text-anchor="end">4</text><path d="M398 419 L458 419" stroke="#f7b731" stroke-width="1.6" stroke-dasharray="4 4"/><text x="468" y="415" font-size="12.5" fill="#f7b731" font-weight="600" text-anchor="start">ceiling for an anonymous</text><text x="468" y="431" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">beacon alarm — a stranger's tap</text><text x="468" y="447" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">never dispatches an ambulance</text><rect x="760" y="150" width="430" height="116" rx="16" fill="#182238" stroke="#26314e" stroke-width="1.2"/><rect x="760" y="150" width="4" height="116" rx="2" fill="#43e08a"/><text x="780" y="180" font-size="15" fill="#eef1f7" font-weight="700" text-anchor="start">The life layer</text><text x="780" y="204" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">Consented sources, check-ins, goals, habit</text><text x="780" y="224" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">streaks, journal, and a 24/7 coach across</text><text x="780" y="244" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">six life areas.</text><rect x="760" y="288" width="430" height="116" rx="16" fill="#182238" stroke="#26314e" stroke-width="1.2"/><rect x="760" y="288" width="4" height="116" rx="2" fill="#3aa0ff"/><text x="780" y="318" font-size="15" fill="#eef1f7" font-weight="700" text-anchor="start">Care beacons</text><text x="780" y="342" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">A printed code on a fridge door or a walker.</text><text x="780" y="362" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">A first name and a button — never a status,</text><text x="780" y="382" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">never a location.</text><rect x="1138.8" y="302" width="37.2" height="22" rx="11" fill="rgba(255,255,255,0.05)" stroke="#3aa0ff" stroke-width="1"/><text x="1157.4" y="317.5" font-size="10.5" fill="#3aa0ff" font-weight="700" text-anchor="middle">NEW</text><rect x="760" y="426" width="430" height="116" rx="16" fill="#182238" stroke="#26314e" stroke-width="1.2"/><rect x="760" y="426" width="4" height="116" rx="2" fill="#38bdf8"/><text x="780" y="456" font-size="15" fill="#eef1f7" font-weight="700" text-anchor="start">Family &amp; the relay</text><text x="780" y="480" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">Oversight sized by age, ending at 18. On a</text><text x="780" y="500" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">site, a roster worked in order until a named</text><text x="780" y="520" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">human accepts.</text><text x="86" y="596" font-size="12.5" fill="#626d88" font-weight="400" text-anchor="start">Not a medical device. Call your local emergency number first — detection can be wrong in both directions.</text></svg>