<svg role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="Helvetica, Arial, sans-serif"><title id="t">Guardian tandem architecture</title><desc id="d">Wearable signals to the Guardian, optional QRME specialist, escalation always local. Generated by tools/build_assets.py.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1626"/><stop offset="1" stop-color="#0a0f1c"/></linearGradient><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#3aa0ff"/></linearGradient><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#43e08a" stop-opacity="0.30"/><stop offset="1" stop-color="#43e08a" stop-opacity="0"/></radialGradient><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#626d88"/></marker></defs><rect width="1280" height="640" fill="url(#bg)"/><text x="86" y="76" font-size="30" fill="#eef1f7" font-weight="800" text-anchor="start">Guardian tandem</text><text x="86" y="106" font-size="14" fill="#8a94ad" font-weight="400" text-anchor="start">Signals in, guidance out — and the one path that never leaves the deployment.</text><rect x="86" y="168" width="250" height="120" rx="16" fill="#182238" stroke="#26314e" stroke-width="1.2"/><rect x="86" y="168" width="4" height="120" rx="2" fill="#38bdf8"/><text x="106" y="198" font-size="15" fill="#eef1f7" font-weight="700" text-anchor="start">Signals</text><text x="106" y="222" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">Heart rate, motion, context,</text><text x="106" y="242" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">check-ins, journal notes.</text><rect x="400" y="168" width="250" height="120" rx="16" fill="#182238" stroke="#26314e" stroke-width="1.2"/><rect x="400" y="168" width="4" height="120" rx="2" fill="#43e08a"/><text x="420" y="198" font-size="15" fill="#eef1f7" font-weight="700" text-anchor="start">Guardian</text><text x="420" y="222" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">Baseline, detection,</text><text x="420" y="242" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">forecast, sensitivity dial.</text><rect x="714" y="168" width="250" height="120" rx="16" fill="#182238" stroke="#26314e" stroke-width="1.2"/><rect x="714" y="168" width="4" height="120" rx="2" fill="#3aa0ff"/><text x="734" y="198" font-size="15" fill="#eef1f7" font-weight="700" text-anchor="start">Guidance</text><text x="734" y="222" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">Its own engine, or a QRME</text><text x="734" y="242" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">specialist over HTTP.</text><rect x="1028" y="168" width="166" height="120" rx="16" fill="#182238" stroke="#26314e" stroke-width="1.2"/><rect x="1028" y="168" width="4" height="120" rx="2" fill="#f7b731"/><text x="1048" y="198" font-size="15" fill="#eef1f7" font-weight="700" text-anchor="start">PDI</text><text x="1048" y="222" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">Sealed, and</text><text x="1048" y="242" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">audit-chained.</text><path d="M344 228 L392 228" stroke="#626d88" stroke-width="1.8" fill="none" marker-end="url(#ah)"/><path d="M658 228 L706 228" stroke="#626d88" stroke-width="1.8" fill="none" marker-end="url(#ah)"/><path d="M972 228 L1020 228" stroke="#626d88" stroke-width="1.8" fill="none" marker-end="url(#ah)"/><rect x="400" y="372" width="564" height="96" rx="16" fill="#1f2b45" stroke="#ff3b30" stroke-width="1.4"/><rect x="400" y="372" width="4" height="96" rx="2" fill="#ff3b30"/><text x="422" y="402" font-size="15" fill="#eef1f7" font-weight="700" text-anchor="start">Escalation stays local</text><text x="422" y="426" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">Crisis handling never routes through a synthetic profile, tandem or not —</text><text x="422" y="446" font-size="12.5" fill="#8a94ad" font-weight="400" text-anchor="start">and an anonymous beacon alarm is capped at notify_contact.</text><path d="M524 296 L524 364" stroke="#ff3b30" stroke-width="1.8" fill="none" marker-end="url(#ah)" stroke-dasharray="5 4"/><text x="86" y="540" font-size="13" fill="#626d88" font-weight="400" text-anchor="start">Without a QRME endpoint the Guardian answers from its own engine; without PDI it keeps its own store.</text><text x="86" y="562" font-size="13" fill="#626d88" font-weight="400" text-anchor="start">Neither absence degrades safety — the tandem is an addition, never a dependency.</text></svg>