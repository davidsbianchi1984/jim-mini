# XcodeGen spec — generates JimGuardian.xcodeproj.
#   brew install xcodegen && xcodegen generate && open JimGuardian.xcodeproj
name: JimGuardian
options:
  bundleIdPrefix: app.jim
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  JimGuardian:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.jim.guardian
        MARKETING_VERSION: "2.9.0"
        CURRENT_PROJECT_VERSION: "2009000"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
    # A generated Info.plist and an `info:` block are mutually exclusive:
    # GENERATE_INFOPLIST_FILE takes scalar INFOPLIST_KEY_* settings only, and
    # NSAppTransportSecurity is a dictionary. So the plist is written here —
    # and `path` is required, which is what the spec was missing.
    #
    # Kept outside Sources/ so XcodeGen does not also sweep the file it just
    # generated into the target as a resource.
    info:
      path: JimGuardian-Info.plist
      properties:
        CFBundleDisplayName: JIM Guardian
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UILaunchScreen: {}
        # The Talk card records a short clip for /voice/transcribe, and a
        # walking conversation keeps the microphone open while you are in
        # another app. iOS kills an app that opens the microphone without
        # this string, and the string is also what a person reads in
        # Settings months later — so it says the second thing too rather
        # than describing only the gentler half.
        # The synced address book: read once per press of sync, never in the
        # background. Names and one number each go up under the contacts
        # grant; withdrawing the grant drops the book server-side.
        NSContactsUsageDescription: "JIM syncs the names in your contacts, with your permission, so a caller can be recognised as somebody to you. Numbers are matched and never shown back; withdrawing the permission deletes the book."
        NSMicrophoneUsageDescription: "JIM listens while you hold the talk button, and — if you choose to take a conversation with you — while you are in other apps. iOS shows an orange dot in the status bar for as long as it is listening, and the conversation ends the moment you end it."
        # Speech recognition is its own permission, and its own refusal.
        NSSpeechRecognitionUsageDescription: "JIM turns what you say into words so it can answer. On phones that support it this happens on the device, and the audio does not leave your phone."
        # The conversation you took with you, out of the app entirely.
        #
        #     asked     can the conversation survive a screen change
        #     mattered  can it survive leaving the application
        #
        # `audio` is what lets an active AVAudioSession keep running once
        # this app is no longer on screen. The orange indicator the system
        # then draws is the point rather than a side effect: it is the
        # difference between a conversation somebody is carrying and an app
        # recording them after they left it. Nothing here starts on its own
        # — the session is opened by a press and deactivated on stop, and
        # the guard beside `Walk.swift` holds both ends of that.
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Allow http://127.0.0.1:8000 in the Simulator (local dev backend).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
