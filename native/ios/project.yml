# XcodeGen spec — generates JimGuardian.xcodeproj.
#   brew install xcodegen && xcodegen generate && open JimGuardian.xcodeproj
name: JimGuardian
options:
  bundleIdPrefix: app.jim
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  JimGuardian:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.jim.guardian
        MARKETING_VERSION: "0.61.1"
        CURRENT_PROJECT_VERSION: "61001"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
    # A generated Info.plist and an `info:` block are mutually exclusive:
    # GENERATE_INFOPLIST_FILE takes scalar INFOPLIST_KEY_* settings only, and
    # NSAppTransportSecurity is a dictionary. So the plist is written here —
    # and `path` is required, which is what the spec was missing.
    #
    # Kept outside Sources/ so XcodeGen does not also sweep the file it just
    # generated into the target as a resource.
    info:
      path: JimGuardian-Info.plist
      properties:
        CFBundleDisplayName: JIM Guardian
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UILaunchScreen: {}
        # The Talk card records a short clip for /voice/transcribe.
        # iOS kills an app that opens the microphone without this string.
        NSMicrophoneUsageDescription: "JIM records a short clip only while you hold the talk button, to hear what you said. The audio is sent for transcription and not stored."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Allow http://127.0.0.1:8000 in the Simulator (local dev backend).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
