# Does the record still describe GitHub?
#
# `stale_release_bodies.txt` lists the releases whose published body is the
# frozen v0.24.0 prose. That list is only worth keeping if something compares
# it to the thing it describes, and the thing it describes is on GitHub — so
# this cannot be a pytest guard. The suite is hermetic on purpose: a check that
# needs the network is a skip offline, and a skip is a check that does not run.
#
#     asked     does the record parse
#     mattered  does the record still match the releases
#
# Two directions, because one of them is the whole finding. A recorded tag that
# is no longer stale means a backfill landed and the row should go. A release
# that is stale and *unrecorded* means the record stopped describing reality —
# which is how one file came to be published onto a hundred and thirty-four
# tags with nothing noticing.
#
# It is not a merge gate. It reads published releases, which exist only after
# a tag, and it runs on a schedule and on demand. `release-integrity.yml` is
# the per-release check that fires on publish; this is the sweep over history.

name: release-bodies-sweep

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the record against the published releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, sys

          repo = os.environ["REPO"]
          record = next(pathlib.Path(".").glob("**/stale_release_bodies.txt"))
          rows = {}
          for line in record.read_text(encoding="utf-8").splitlines():
              if not line.strip() or line.startswith("#"):
                  continue
              tag, _, reason = line.partition("  ")
              rows[tag.strip()] = reason.strip()

          out = subprocess.run(
              ["gh", "api", "--paginate", f"/repos/{repo}/releases?per_page=100"],
              capture_output=True, text=True)
          if out.returncode != 0:
              sys.exit(f"::error::could not read releases: {out.stderr[:300]}")
          rels = []
          for chunk in re.findall(r"\[.*?\]\s*(?=\[|$)", out.stdout, re.S) or [out.stdout]:
              try: rels += json.loads(chunk)
              except Exception: pass

          def prose(b: str) -> str:
              for m in ("## What's Changed", "**Full Changelog**"):
                  if m in b:
                      b = b.split(m)[0]
              return b.strip()

          # A body is stale when its prose *opens* as the frozen one does. The
          # opening line is per product and is read from the record's own
          # `# frozen-opens:` header, so nothing here carries a copy.
          #
          # This replaced a check for `414 tests passing` anywhere in the body,
          # which was wrong twice: that count is PDI's, so the sweep reported
          # zero stale in the two products where 112 and 113 remained; and it
          # matched any release note that *quoted* the phrase, so PDI's own
          # 0.60.8 notes failed for describing the finding they fixed.
          opens = re.search(r"^# frozen-opens: (.+)$",
                            record.read_text(encoding="utf-8"), re.M)
          if not opens:
              sys.exit(f"::error::{record} has no `# frozen-opens:` header, so "
                       "staleness cannot be decided")
          mark = opens.group(1).strip()
          stale = {r["tag_name"] for r in rels
                   if re.match(r"app-v\d+\.\d+\.\d+$", r.get("tag_name") or "")
                   and prose(r.get("body") or "").startswith(mark)}

          # A `# kept:` release is deliberately left as it is, so it is
          # expected to still carry the frozen body: neither unrecorded nor
          # awaiting repair. The ceiling counts what is still wrong, and these
          # are not.
          kept = set(re.findall(r"^# kept: (app-v[\d.]+) — ",
                                record.read_text(encoding="utf-8"), re.M))
          gone = sorted(t for t in rows if t not in stale)
          new = sorted(t for t in stale if t not in rows and t not in kept)
          lost = sorted(t for t in kept if t not in stale)
          if lost:
              problems.append(
                  f"{len(lost)} kept release(s) no longer carry the frozen "
                  f"body:\n    " + "\n    ".join(lost)
                  + "\n  These were deliberately left alone. One changing "
                    "means it was repaired by mistake, or the decision was "
                    "reversed without the reason being struck.")
          problems = []

              problems.append(
                  f"{len(gone)} recorded release(s) are no longer stale — strike "
                  f"them from {record} and lower the ceiling:\n    "
                  + "\n    ".join(gone[:20]))
          if new:
              problems.append(
                  f"{len(new)} release(s) carry the frozen body and are not "
                  f"recorded:\n    " + "\n    ".join(new[:20])
                  + "\n  A body cannot become stale on its own. Either one was "
                    "pasted from an older release, or the record was edited "
                    "without the releases being repaired.")
          if problems:
              print(f"::error::the record and the releases disagree")
              for p in problems:
                  print(p)
              sys.exit(1)
          print(f"{len(rows)} recorded, {len(stale)} stale, and they agree")
          PY
