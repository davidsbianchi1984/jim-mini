<svg xmlns="http://www.w3.org/2000/svg" width="320" height="660" viewBox="0 0 320 660" role="img" aria-label="Correspondence screen"><defs>
      <linearGradient id="gScr" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0e1626"/><stop offset="1" stop-color="#0a0f1c"/></linearGradient>
      <linearGradient id="gFrame" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#20263a"/><stop offset="1" stop-color="#0c1020"/></linearGradient>
      <linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#182238"/><stop offset="1" stop-color="#1f2b45"/></linearGradient>
      <linearGradient id="gBrand" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#3aa0ff"/></linearGradient>
    </defs>
    <rect x="10" y="12" width="300" height="636" rx="40" fill="url(#gFrame)"/>
    <rect x="20" y="22" width="280" height="616" rx="31" fill="url(#gScr)"/>
    <rect x="130" y="27" width="60" height="15" rx="7.5" fill="#05070d"/>
    <text x="34" y="56" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="11" font-weight="600" fill="#8a94ad">9:41</text>
    <rect x="264" y="50" width="20" height="11" rx="3" fill="none" stroke="#8a94ad" stroke-width="1.1"/>
    <rect x="266" y="52" width="14" height="7" rx="2" fill="#8a94ad"/>
    <text x="34" y="88" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="20" font-weight="700" fill="#eef1f7" letter-spacing="-0.4">Correspondence</text>
    <text x="34" y="106" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="11.5" fill="#8a94ad">The coach drafts · you approve</text>
    <!-- the moderated-posture note -->
    <rect x="34" y="120" width="252" height="46" rx="12" fill="url(#gCard)" stroke="#26314e" stroke-width="1"/>
    <circle cx="52" cy="143" r="7" fill="rgba(124,92,255,0.2)" stroke="#7c5cff" stroke-width="1.5"/>
    <path d="M48.5 143 l2.4 2.4 l4.6 -4.8" fill="none" stroke="#7c5cff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="139" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="10" font-weight="650" fill="#eef1f7">Every send is held for you</text>
    <text x="68" y="153" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="8.5" fill="#8a94ad">Nothing leaves on its own.</text>
    <!-- a thread -->
    <text x="34" y="190" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="9" font-weight="700" fill="#626d88" letter-spacing="0.6">THREAD</text>
    <rect x="34" y="200" width="252" height="300" rx="14" fill="url(#gCard)" stroke="#26314e" stroke-width="1"/>
    <text x="48" y="222" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="11" font-weight="700" fill="#eef1f7">rosa@example.com</text>
    <text x="48" y="237" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="9" fill="#8a94ad">Checking in</text>
    <rect x="228" y="210" width="46" height="16" rx="8" fill="rgba(247,183,49,0.18)" stroke="#f7b731" stroke-width="1"/>
    <text x="251" y="221.5" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="8" font-weight="700" fill="#f7b731" text-anchor="middle">1 held</text>
    <!-- inbound bubble -->
    <rect x="48" y="252" width="40" height="15" rx="7.5" fill="rgba(58,160,255,0.16)" stroke="#3aa0ff" stroke-width="1"/>
    <text x="68" y="263" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="8" font-weight="700" fill="#3aa0ff" text-anchor="middle">In</text>
    <rect x="48" y="272" width="224" height="40" rx="10" fill="#0b1220" stroke="#26314e" stroke-width="1"/>
    <text x="58" y="289" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="9.5" fill="#c7cede">How are you doing? Haven't heard</text>
    <text x="58" y="302" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="9.5" fill="#c7cede">from you in a while.</text>
    <!-- held draft -->
    <rect x="48" y="322" width="90" height="15" rx="7.5" fill="rgba(247,183,49,0.16)" stroke="#f7b731" stroke-width="1"/>
    <text x="93" y="333" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="8" font-weight="700" fill="#f7b731" text-anchor="middle">Draft — held for you</text>
    <rect x="48" y="342" width="224" height="70" rx="10" fill="#0b1220" stroke="#33406a" stroke-width="1.2"/>
    <text x="58" y="360" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="9.5" fill="#eef1f7">Hi Rosa — thank you for checking</text>
    <text x="58" y="373" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="9.5" fill="#eef1f7">in. I'm doing well and keeping to</text>
    <text x="58" y="386" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="9.5" fill="#eef1f7">the walks. Let's catch up soon —</text>
    <text x="58" y="399" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="9.5" fill="#8a94ad">JIM, on behalf of Ada</text>
    <!-- moderation buttons -->
    <rect x="48" y="424" width="104" height="30" rx="9" fill="url(#gBrand)"/>
    <text x="100" y="443" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Approve &amp; send</text>
    <rect x="160" y="424" width="52" height="30" rx="9" fill="none" stroke="#33406a" stroke-width="1.3"/>
    <text x="186" y="443" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="10" font-weight="600" fill="#c7cede" text-anchor="middle">Edit</text>
    <rect x="220" y="424" width="52" height="30" rx="9" fill="none" stroke="#33406a" stroke-width="1.3"/>
    <text x="246" y="443" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="10" font-weight="600" fill="#ff8a80" text-anchor="middle">Discard</text>
    <text x="48" y="480" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="8.5" fill="#626d88">Approved replies send over your mail</text>
    <text x="48" y="492" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="8.5" fill="#626d88">server, or are staged and held if none.</text>
    <!-- bottom nav -->
    <rect x="20" y="586" width="280" height="52" fill="#0b1220"/>
    <rect x="20" y="586" width="280" height="1" fill="#26314e"/>
    <circle cx="60" cy="604" r="5.4" fill="none" stroke="#eef1f7" stroke-width="1.2"/>
    <text x="60" y="626" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="8.5" font-weight="600" fill="#eef1f7" text-anchor="middle">Home</text>
    <path d="M150 599 h20 M150 604 h20 M150 609 h14" stroke="#7c5cff" stroke-width="1.4" stroke-linecap="round"/>
    <text x="160" y="626" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#7c5cff" text-anchor="middle">Mail</text>
    <circle cx="260" cy="601" r="2.4" fill="none" stroke="#626d88" stroke-width="1.2"/>
    <path d="M255.7 609 c0 -4.3 8.6 -4.3 8.6 0" fill="none" stroke="#626d88" stroke-width="1.2"/>
    <text x="260" y="626" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="8.5" font-weight="600" fill="#626d88" text-anchor="middle">Profile</text>
    <rect x="118" y="631" width="84" height="4" rx="2" fill="rgba(255,255,255,0.6)"/>
</svg>
