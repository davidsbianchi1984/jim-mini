<svg role="img" aria-labelledby="tft tfd" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700" font-family="Helvetica, Arial, sans-serif"><title id="tft">Tandem architecture — qrme, jim-mini and pdi</title><desc id="tfd">A suite gateway over three products. jim-mini asks qrme for specialist guidance; jim-mini and qrme seal payloads into pdi; and pdi asks qrme for the words its gate agent speaks. Every link is optional and runs over public HTTP. Generated by tools/build_assets.py.</desc><defs><linearGradient id="tfbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#181235"/><stop offset="1" stop-color="#0c0920"/></linearGradient><marker id="tf_qrme" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9d7bff"/></marker><marker id="tf_jim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7bc47f"/></marker><marker id="tf_pdi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker><marker id="tf_out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffb84d"/></marker><marker id="tf_gw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6a6399"/></marker></defs><rect width="1180" height="700" fill="url(#tfbg)"/><text x="70" y="64" font-size="30" fill="#f2effc" font-weight="800" text-anchor="start" letter-spacing="1">Tandem architecture</text><text x="70" y="92" font-size="14" fill="#9a93c6" font-weight="400" text-anchor="start">Three products, three repositories, four optional HTTP links.</text><rect x="70" y="120" width="1040" height="84" rx="16" fill="#201a48" stroke="#302a60" stroke-width="1.2"/><rect x="70" y="120" width="4" height="84" rx="2" fill="#9a93c6"/><text x="90" y="152" font-size="16" fill="#f2effc" font-weight="700" text-anchor="start">suite gateway — qrme/suite/gateway.py</text><text x="90" y="178" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">POST /suite/erase · POST /suite/export · PUT /suite/consent · POST /suite/usage</text><text x="90" y="199" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">one linked identity · a per-product receipt, so a partial failure is visible rather than swallowed</text><rect x="70" y="274" width="320" height="140" rx="16" fill="#201a48" stroke="#302a60" stroke-width="1.2"/><rect x="70" y="274" width="4" height="140" rx="2" fill="#7bc47f"/><text x="90" y="306" font-size="16" fill="#f2effc" font-weight="700" text-anchor="start">jim-mini — Guardian</text><text x="90" y="332" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">monitor → predict → guide → escalate</text><text x="90" y="353" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">life layer · check-in · journal</text><text x="90" y="374" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">care beacons · workplace relay</text><rect x="560" y="274" width="320" height="140" rx="16" fill="#201a48" stroke="#302a60" stroke-width="1.2"/><rect x="560" y="274" width="4" height="140" rx="2" fill="#9d7bff"/><text x="580" y="306" font-size="16" fill="#f2effc" font-weight="700" text-anchor="start">qrme — synthetic profiles</text><text x="580" y="332" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">relationship-aware · remembered</text><text x="580" y="353" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">moderation · the burned-in AI mark</text><text x="580" y="374" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">live desks · beacons · marketplace</text><rect x="70" y="512" width="1040" height="104" rx="16" fill="#201a48" stroke="#302a60" stroke-width="1.2"/><rect x="70" y="512" width="4" height="104" rx="2" fill="#38bdf8"/><text x="90" y="544" font-size="16" fill="#f2effc" font-weight="700" text-anchor="start">pdi — Private Data Infrastructure</text><text x="90" y="570" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">AES-256-GCM vault · per-tenant isolation · tamper-evident audit chain · BYOK</text><text x="90" y="591" font-size="12.5" fill="#9a93c6" font-weight="400" text-anchor="start">custody beacons · the agent at the gate — the model is the voice, not the decider</text><path d="M170 204 L170 274" stroke="#6a6399" stroke-width="1.8" fill="none" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#tf_gw)"/><path d="M660 204 L660 274" stroke="#6a6399" stroke-width="1.8" fill="none" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#tf_gw)"/><path d="M1060 204 L1060 512" stroke="#6a6399" stroke-width="1.8" fill="none" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#tf_gw)"/><path d="M390 330 L560 330" stroke="#7bc47f" stroke-width="1.8" fill="none" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#tf_jim)"/><text x="475" y="318" font-size="12.5" fill="#7bc47f" font-weight="600" text-anchor="middle">specialist guidance</text><path d="M150 414 L150 512" stroke="#7bc47f" stroke-width="1.8" fill="none" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#tf_jim)"/><text x="164" y="452" font-size="12.5" fill="#7bc47f" font-weight="600" text-anchor="start">medical payloads</text><text x="164" y="470" font-size="12.5" fill="#6a6399" font-weight="400" text-anchor="start">sealed</text><path d="M610 414 L610 512" stroke="#9d7bff" stroke-width="1.8" fill="none" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#tf_qrme)"/><text x="624" y="452" font-size="12.5" fill="#9d7bff" font-weight="600" text-anchor="start">source material</text><text x="624" y="470" font-size="12.5" fill="#6a6399" font-weight="400" text-anchor="start">sealed</text><path d="M850 512 L850 414" stroke="#ffb84d" stroke-width="1.8" fill="none" stroke-dasharray="6 5" opacity="0.85" marker-end="url(#tf_out)"/><text x="864" y="452" font-size="12.5" fill="#ffb84d" font-weight="600" text-anchor="start">words for the gate</text><text x="864" y="470" font-size="12.5" fill="#6a6399" font-weight="400" text-anchor="start">never a decision</text><text x="70" y="656" font-size="12.5" fill="#6a6399" font-weight="400" text-anchor="start">Every link is optional and runs over public HTTP — no project imports another's code. Dashed because each product runs alone with none of them configured.</text><text x="70" y="676" font-size="12.5" fill="#6a6399" font-weight="400" text-anchor="start">Amber is the only link that runs out of PDI: the gate agent asks a QRME profile for words after the decision is already made, and nothing generated can change it.</text></svg>