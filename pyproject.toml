[project]
name = "jim-mini"
version = "3.0.1"
description = "Guardian — personal guidance for known conditions: monitor, predict, guide, escalate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "David Bianchi" }]
keywords = ["ai", "personal-guidance", "biometrics", "wellness", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "anthropic>=0.117",
    "segno>=1.6",       # shareable Medical ID QR
    # Imported at module scope by the server itself, so they are the
    # image's to carry — a runtime import living only in the dev extra
    # boots every test run and crash-loops the beta box, which is
    # exactly how httpx was field-reported (it had ridden into earlier
    # images as somebody else's transitive dependency, until a rebuild
    # resolved versions where it no longer came along).
    "httpx>=0.27",      # engaged sessions call the product's own doors
    "pydantic>=2",      # imported directly, not only through fastapi
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/davidsbianchi1984/jim-mini"
Repository = "https://github.com/davidsbianchi1984/jim-mini"
Changelog = "https://github.com/davidsbianchi1984/jim-mini/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jim*"]

[tool.pytest.ini_options]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
testpaths = ["jim/tests"]
